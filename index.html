<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PLACEHOLDER - SEO. Replace the title, description, URLs and share image. -->
    <title>Shaina Dellomas — Virtual Assistant &amp; Operations Partner</title>
    <meta name="description" content="A results-driven Virtual Assistant helping busy founders and e-commerce brands stay on top of customer support, daily operations, and admin work reliably." />
    <meta name="author" content="Shaina Dellomas" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#F4F4ED" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/photos/shaina.jpg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shaina Dellomas" />
    <meta property="og:title" content="Shaina Dellomas — Virtual Assistant &amp; Operations Partner" />
    <meta property="og:description" content="Your calm, capable right hand for the busy days. Handling customer support, e-commerce operations, and daily admin." />
    <meta property="og:image" content="/photos/shaina.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
